<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.t{--bg:#FBFBFC;--panel:#FFFFFF;--side:#F5F5F7;--line:#E6E6EB;--line2:#D6D6DE;--text:#1C1C21;--muted:#5F5F6B;--hover:#EBEBEF;--accent:#5B5BD6;--accent-ink:#4646B5;--accent-weak:#ECECFB;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:13px;line-height:1.45;color:var(--text);-webkit-font-smoothing:antialiased}
.t.dark{--bg:#0E0E10;--panel:#141417;--side:#111113;--line:#26262C;--line2:#34343C;--text:#ECECF1;--muted:#A3A3AE;--hover:#1E1E23;--accent:#8E8FF5;--accent-ink:#ABACF9;--accent-weak:#24244A}
.t{--mk-t:#5B5BD6;--mk-l:#3B3B9E;--mk-r:#8E8FF5}
.t.dark{--mk-t:#8E8FF5;--mk-l:#5B5BD6;--mk-r:#B9BAFB}
.t *{box-sizing:border-box}
.side{width:100%;min-height:100%;background:var(--side);border-right:1px solid var(--line);padding:14px 10px 12px;display:flex;flex-direction:column;gap:1px}
.t a.nav{display:flex;align-items:center;gap:9px;height:30px;padding:0 8px;border-radius:6px;color:var(--text);text-decoration:none;font-weight:500}
.t a.nav:hover{background:var(--hover)}
.t a.nav.on{background:var(--hover);color:var(--text)}
.t a.nav svg{color:var(--muted);flex:none}
.t a.nav.on svg{color:var(--accent)}
.t a.nav.sub{height:28px;padding-left:34px;font-weight:400;color:var(--muted)}
.t a.nav.sub.on{color:var(--text);font-weight:500}
.cnt{margin-left:auto;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.grp{font-size:11px;font-weight:500;color:var(--muted);padding:16px 8px 4px;letter-spacing:0.02em}
.sw{display:flex;align-items:center;gap:8px;width:100%;height:36px;padding:0 8px;border:1px solid var(--line2);border-radius:7px;background:var(--panel);color:var(--text);font:inherit;font-weight:500;cursor:pointer;margin:10px 0 4px;text-align:left}
.ico{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:5px;flex:none}
.av{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;font-size:11px;font-weight:600;color:#fff;flex:none}
.kbd{font-family:"JetBrains Mono",monospace;font-size:10.5px;border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;padding:0 4px;color:var(--muted)}
.t a.so{font-size:12px;color:var(--muted);text-decoration:none}
.t a.so:hover{color:var(--text)}
</style>
</helmet>
<nav class="t {{themeClass}}" aria-label="Main" style="width: 100%; min-height: 900px; display: flex">

<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["dashboard","products","insights","import","verify","inventories","catalogue","categories","activity","staff","invites","help","search"],"default":"dashboard"},"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":240,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'dashboard';
    const keys = ['dashboard', 'products', 'insights', 'import', 'verify', 'inventories', 'catalogue', 'categories', 'activity', 'staff', 'invites', 'help', 'search'];
    const on = {};
    keys.forEach((k) => { on[k] = k === active ? 'on' : ''; });
    return { on: on, themeClass: (this.props.theme ?? 'light') === 'dark' ? 'dark' : '' };
  }
}
</script>
