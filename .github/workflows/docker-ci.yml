name: Docker image

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose:
    name: Build image, smoke test and run tests in container
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build and start the stack
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Check the health endpoint and sign-in page
        run: |
          curl --fail --silent --show-error http://localhost:8000/healthz
          curl --fail --silent --show-error http://localhost:8000/login/ | grep -q 'name="password"'
          curl --fail --silent --show-error --output /dev/null http://localhost:8000/static/tory/app.css
      - name: Confirm the app runs as a non-root user
        run: test "$(docker compose exec -T web id -u)" != "0"
      - name: Confirm no secrets are stored in the image
        run: |
          env_vars="$(docker image inspect tory:local --format '{{range .Config.Env}}{{println .}}{{end}}')"
          echo "$env_vars"
          if echo "$env_vars" | grep -E '^(DJANGO_SECRET_KEY|POSTGRES_PASSWORD|EMAIL_HOST_PASSWORD)='; then
            echo "::error::A secret is set in the image environment"; exit 1
          fi
          if docker run --rm --entrypoint sh tory:local -c 'test -e /app/.env || test -e /app/.git'; then
            echo "::error::.env or .git was copied into the image"; exit 1
          fi
      - name: Run the test suite inside the container
        run: docker compose run --rm -T -e DJANGO_ENV=test -e DJANGO_MIGRATE_ON_START=false web python manage.py test --noinput
      - name: Show container logs
        if: failure()
        run: docker compose logs
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
