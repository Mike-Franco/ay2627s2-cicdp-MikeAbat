name: Django PostgreSQL CI

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  django-postgres:
    name: Check, migrate, and test on PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.3
        env:
          POSTGRES_DB: tory_ci
          POSTGRES_USER: tory_ci
          POSTGRES_PASSWORD: ci-only-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tory_ci -d tory_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_ENV: test
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: ci-only-disposable-test-key-never-use-for-deployment
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_DB: tory_ci
      POSTGRES_USER: tory_ci
      POSTGRES_PASSWORD: ci-only-postgres-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply migrations to fresh PostgreSQL database
        run: python manage.py migrate --noinput
      - name: Run Django system checks
        run: python manage.py check
      - name: Run PostgreSQL-backed smoke tests
        run: python manage.py test --verbosity 2
