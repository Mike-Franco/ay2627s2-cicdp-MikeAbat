# Local stack: `docker compose up`, then open http://localhost:8000/login/.
# Defaults below are for local use only; override them in a .env file.
name: tory

services:
  db:
    image: postgres:18.3
    command: ["postgres", "-c", "track_commit_timestamp=on"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tory}
      POSTGRES_USER: ${POSTGRES_USER:-tory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-compose-only-password}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  web:
    build: .
    image: tory:local
    environment:
      DJANGO_ENV: development
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-compose-only-insecure-secret-key}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      POSTGRES_DB: ${POSTGRES_DB:-tory}
      POSTGRES_USER: ${POSTGRES_USER:-tory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-compose-only-password}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    ports:
      - "${TORY_HTTP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  pgdata:
