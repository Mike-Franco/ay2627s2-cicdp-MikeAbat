<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Tory{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
  <header class="border-bottom bg-light">
    <nav class="container d-flex flex-wrap align-items-center gap-3 py-3" aria-label="Main navigation">
      <a class="fw-bold text-decoration-none text-dark me-2" href="{% url 'home' %}">Tory</a>
      {% if request.user.is_authenticated %}
        <a class="text-decoration-none" href="{% url 'home' %}">Home</a>
        <a class="text-decoration-none" href="{% url 'inventory-list' %}">Inventories</a>
        <a class="text-decoration-none" href="{% url 'product-catalogue' %}">Product catalogue</a>
        {% if inventory %}
          <a class="text-decoration-none" href="{% url 'inventory-detail' inventory.pk %}">{{ inventory.name }}</a>
          <a class="text-decoration-none" href="{% url 'inventory-products' inventory.pk %}">Inventory products</a>
        {% endif %}
        <form class="ms-auto" method="post" action="{% url 'logout' %}">
          {% csrf_token %}
          <button class="btn btn-outline-secondary btn-sm" type="submit">Sign out</button>
        </form>
      {% else %}
        <a class="ms-auto text-decoration-none" href="{% url 'login' %}">Sign in</a>
      {% endif %}
    </nav>
  </header>
  <main class="container py-5">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
