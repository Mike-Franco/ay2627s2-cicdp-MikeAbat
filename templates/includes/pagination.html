{% if always_show or page.has_other_pages %}
<nav aria-label="{{ pagination_label|default:'Pagination' }}" class="d-flex align-items-center gap-3 mb-3">
  {% if page.has_previous %}
    <a href="{% querystring page=page.previous_page_number %}" rel="prev">Previous</a>
  {% else %}
    <span class="text-muted">Previous</span>
  {% endif %}
  <span>Page {{ page.number }} of {{ page.paginator.num_pages }}</span>
  {% if page.has_next %}
    <a href="{% querystring page=page.next_page_number %}" rel="next">Next</a>
  {% else %}
    <span class="text-muted">Next</span>
  {% endif %}
</nav>
{% endif %}
