{% extends "base.html" %}
{% block title %}{% if category.pk %}Edit category{% else %}Add category{% endif %} · Tory{% endblock %}
{% block content %}
<h1>{% if category.pk %}Edit category{% else %}Add category{% endif %}</h1>
<form class="panel p-3" method="post">
  {% csrf_token %}{{ form.as_div }}
  <button class="btn btn-primary">Save category</button>
  <a class="btn btn-outline-secondary" href="{% url 'category-list' business.pk %}">Cancel</a>
</form>
{% endblock %}
