<div class="row-actions">
  {% if inventory.is_active %}
  <a class="btn btn-sm btn-outline-secondary" href="{% url 'inventory-rename' inventory.pk %}" aria-label="Edit {{ inventory.name }}">Edit</a>
  {% else %}
  <form method="post" action="{% url 'inventory-status' inventory.pk %}">
    {% csrf_token %}
    <button class="btn btn-sm btn-outline-primary" name="is_active" value="true" type="submit" aria-label="Reactivate {{ inventory.name }}">Reactivate</button>
  </form>
  {% endif %}
</div>
